name: Préparer un runner de test
description: Installer les dépendances verrouillées et configurer le projet Docker du job.
inputs:
  assets:
    description: Compiler les assets pour les parcours et les contrôles de rendu.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Node.js and npm cache
      if: inputs.assets == 'true'
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: app/package-lock.json
    - name: Cache locked PHP dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: app/vendor
        key: ${{ runner.os }}-php84-vendor-${{ hashFiles('app/composer.json', 'app/composer.lock', 'app/symfony.lock') }}
    - name: Prepare isolated Docker networks and local secrets
      shell: bash
      run: |
        echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
        echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
        docker network create traefik_network || true
        docker network create mail_network || true
        docker run -d --name genesis-ci-traefik --network traefik_network -p 80:80 -v /var/run/docker.sock:/var/run/docker.sock traefik:v3.7.17@sha256:321153f6f732f912cf5c6f0597fe38743fc7895d482d7d8804a479ae0403e151 --providers.docker=true --providers.docker.exposedbydefault=false --entrypoints.web.address=:80
        make configure
    - name: Validate Compose
      shell: bash
      run: make validate
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Build and cache PHP image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: docker/dev/Dockerfile
        load: true
        tags: local/genesis-web:dev
        build-args: |
          LOCAL_UID=${{ env.LOCAL_UID }}
          LOCAL_GID=${{ env.LOCAL_GID }}
        cache-from: type=gha,scope=genesis-ci-php
        cache-to: type=gha,scope=genesis-ci-php,mode=max
    - name: Install locked PHP dependencies
      shell: bash
      run: make install-php
    - name: Build production assets
      if: inputs.assets == 'true'
      shell: bash
      run: |
        (cd app && npm ci)
        make assets
