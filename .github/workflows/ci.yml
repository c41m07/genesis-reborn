name: Genesis Reborn CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genesis-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare isolated Docker networks and local secrets
        run: |
          docker network create traefik_network || true
          docker network create mail_network || true
          docker run -d --name genesis-ci-traefik --network traefik_network -p 80:80 -v /var/run/docker.sock:/var/run/docker.sock traefik:v3.3 --providers.docker=true --providers.docker.exposedbydefault=false --entrypoints.web.address=:80
          make configure
      - name: Validate Compose and build containers
        run: make validate build
      - name: Install locked PHP and frontend dependencies
        run: make install
      - name: Build production assets
        run: make assets
      - name: Start service stack
        run: make start
      - name: Apply migrations and import reference universe
        run: make migrate import
      - name: PHP test suite
        run: make test
      - name: Static and schema checks
        run: make lint
      - name: Browser suite in disposable project
        run: |
          npx playwright install --with-deps chromium
          make test-browser
      - name: Teardown CI stack
        if: always()
        run: |
          docker compose --env-file .env.local down --volumes --remove-orphans || true
          docker rm -f genesis-ci-traefik || true
