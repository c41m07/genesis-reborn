name: Genesis Reborn CI
on:
  # alpha est aussi la branche par défaut ; adapter ce filtre si elle change.
  push:
    branches: [alpha]
  pull_request:
    branches: [dev, alpha]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      category:
        description: Groupe à exécuter
        type: choice
        required: true
        default: Suite complète
        options:
          - Suite complète
          - Qualité et assets
          - Unitaires
          - Services
          - Contrôleurs
          - Intégration et schéma MariaDB
          - Rendu Twig
          - Audits d’interface
          - Administration
          - Empire et progression
          - Flottes et interactions
          - Sauvegarde et restauration
permissions:
  contents: read
concurrency:
  # Un lancement manuel ciblé ne doit pas interrompre une validation de livraison.
  group: genesis-ci-${{ github.event_name }}-${{ github.ref }}-${{ inputs.category || 'all' }}
  cancel-in-progress: true

jobs:
  select:
    name: Sélection des contrôles
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      php: ${{ steps.plan.outputs.php }}
      browser: ${{ steps.plan.outputs.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: plan
        env:
          CATEGORY: ${{ github.event.pull_request.draft && 'development' || inputs.category || 'all' }}
        run: python3 scripts/ci-categories.py

  static:
    needs: select
    if: contains(fromJSON('["all","development","quality"]'), needs.select.outputs.scope)
    name: ${{ needs.select.outputs.scope == 'development' && 'development checks' || 'Qualité et assets' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - run: git diff --check HEAD^ HEAD
      - uses: ./.github/actions/prepare-ci
      - run: make lint-static EXEC="docker compose --env-file .env.local run --rm --no-deps --user $(id -u):$(id -g) app"
      - if: needs.select.outputs.scope == 'development'
        run: make test-python

  php:
    needs: select
    if: needs.select.outputs.php != '[]'
    name: PHP · ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.php) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/prepare-ci
      # PHPUnit force database-test et les transports en mémoire dans son bootstrap.
      - run: docker compose --env-file .env.local up -d --no-deps --wait app
      - run: make test-php PHP_TEST_PATH="tests/$CATEGORY"
        env:
          CATEGORY: ${{ matrix.category }}
      - if: matrix.category == 'Integration'
        run: |
          docker compose --env-file .env.local up -d --wait database
          make migrate lint-schema

  backup:
    needs: select
    if: needs.select.outputs.scope == 'all' || needs.select.outputs.scope == 'backup'
    name: Sauvegarde et restauration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/prepare-ci
        with:
          assets: 'false'
      - run: docker compose --env-file .env.local pull database
      - run: make test-python test-backup

  reference:
    needs: select
    if: needs.select.outputs.browser != '[]'
    name: Base de référence navigateur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/prepare-ci
        with:
          assets: 'false'
      - run: make test-browser BROWSER_ARGS="--prepare-reference $RUNNER_TEMP/browser-reference"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-reference-${{ github.sha }}
          path: ${{ runner.temp }}/browser-reference/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  browser:
    needs: [select, reference]
    if: needs.select.outputs.browser != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.browser) }}
    name: Navigateur · ${{ matrix.label }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/prepare-ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: browser-reference-${{ github.sha }}
          path: ${{ runner.temp }}/browser-reference
      - name: Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Parcours · ${{ matrix.category }}
        env:
          CATEGORY: ${{ matrix.category }}
          BROWSER_PERSISTENCE: '1'
          BROWSER_REFERENCE_DIR: ${{ runner.temp }}/browser-reference
        run: make test-browser BROWSER_ARGS="--project=$CATEGORY"

  complete:
    needs: [select, static, php, backup, reference, browser]
    if: always() && needs.select.outputs.scope == 'all'
    # Ces cinq noms sont déjà obligatoires sur dev et alpha. Les publier seulement
    # pour le bilan complet évite de modifier les protections pendant la transition.
    strategy:
      matrix:
        check: ${{ fromJSON(needs.select.outputs.scope == 'all' && '["quality (php, lot 0)","quality (browser, lot 1)","quality (browser, lot 2)","quality (browser, lot 3)","quality (browser, lot 4)"]' || '["Fin de sélection"]') }}
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    steps:
      - name: Exiger la réussite de chaque groupe sur ce commit
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          for name, job in json.loads(os.environ['RESULTS']).items():
              print(name, job['result'])
              if job['result'] != 'success':
                  raise SystemExit(1)
          PYTHON
  publish:
    needs: complete
    if: needs.complete.result == 'success' && (inputs.category == '' || inputs.category == 'Suite complète') && (github.ref == 'refs/heads/alpha' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Define image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish production image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker build -f docker/prod/Dockerfile -t "$IMAGE:$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" .
          docker push "$IMAGE:$GITHUB_SHA" | tee /tmp/push-result
          DIGEST=$(sed -n 's/.*digest: \(sha256:[a-f0-9]*\).*/\1/p' /tmp/push-result)
          test -n "$DIGEST"
          printf 'Image à déployer : `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
