name: Deploy Genesis Reborn
on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'Digest publié par la CI (sha256:...)'
        required: true
permissions:
  contents: read
concurrency:
  group: genesis-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/alpha' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Deploy immutable image over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REPOSITORY: ${{ github.repository }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          scp -o BatchMode=yes docker/compose.prod.yaml scripts/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/opt/docker-compose/genesis-reborn/"
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/docker-compose/genesis-reborn && bash deploy.sh 'ghcr.io/${REPOSITORY,,}@$DIGEST'"
