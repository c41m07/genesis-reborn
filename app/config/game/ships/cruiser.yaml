  "tier_descriptions": {
    "basic": "Vaisseau de ligne polyvalent formant la colonne vertébrale des flottes. Il offre un bon équilibre entre puissance de feu, résistance et portée, et combat efficacement frégates, croiseurs et destroyers. Armement visible : batteries de canons à plasma disposées sur les deux flancs.",
    "intermediate": "Croiseur d’artillerie capable de soutenir durablement une ligne de bataille. Il échange de larges bordées contre frégates, croiseurs et destroyers. Armement visible : batteries latérales de canons à plasma renforcées.",
    "superior": "Croiseur de bataille optimisé pour les affrontements prolongés. Il conserve une grande polyvalence de ligne et peut tenir le centre d’une flotte. Armement visible : longues batteries de canons à plasma sur les flancs, capables de tirer des bordées coordonnées."
