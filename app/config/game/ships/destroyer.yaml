  "tier_descriptions": {
    "basic": "Vaisseau de guerre spécialisé dans la destruction des bâtiments lourds à moyenne et longue portée. Il chasse croiseurs, destroyers et cuirassés, mais reste moins polyvalent qu’un croiseur. Armement visible : canon électromagnétique axial occupant la proue, tirant des obus hypervéloces.",
    "intermediate": "Destroyer de ligne conçu pour concentrer sa puissance sur les coques militaires lourdes. Il excelle contre les croiseurs et menace les cuirassés avec son railgun axial. Armement visible : canon électromagnétique axial renforcé, intégré à la proue.",
    "superior": "Destroyer de rupture optimisé pour perforer les formations de vaisseaux de guerre. Sa puissance vient d’un tir axial précis plutôt que d’une large polyvalence. Armement visible : railgun de proue surdimensionné, tirant des projectiles hypervéloces à longue portée."
