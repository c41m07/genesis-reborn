  "tier_descriptions": {
    "basic": "Chasseur plus résistant qu’un modèle classique, mais moins rapide. Il sert à percer les défenses légères et à attaquer les petites unités de guerre comme chasseurs, bombardiers et frégates. Armement visible : deux canons rotatifs à plasma sous les ailes, projetant des tirs énergétiques verts.",
    "intermediate": "Chasseur-bombardier lourd renforcé pour les assauts rapprochés contre les petites coques militaires. Il conserve une bonne pression contre chasseurs et bombardiers, tout en menaçant les frégates. Armement visible : canons rotatifs à plasma verts sous les ailes, avec cadence accrue.",
    "superior": "Chasseur d’appui blindé destiné à ouvrir des brèches dans les escortes légères. Sa résistance et ses armes à plasma en font une menace directe pour les frégates isolées. Armement visible : doubles canons rotatifs à plasma lourd, tirant des projectiles verts concentrés."
