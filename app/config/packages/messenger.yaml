framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 2
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange: {name: genesis_v2_failed}
                    queues: {genesis_v2_failed: ~}
        routing:
            'App\Message\QueueItemFinished': async
            'App\Message\FleetArrived': async
            'App\Message\CombatEventDue': async
            'App\Message\OccupationDue': async
            'App\Message\UniverseClosureDue': async
when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
