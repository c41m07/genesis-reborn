framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 2
            combat_simulation:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange: {name: genesis_v2_combat_simulation}
                    queues: {genesis_v2_combat_simulation: ~}
                retry_strategy:
                    max_retries: 2
                    delay: 1000
                    multiplier: 2
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange: {name: genesis_v2_failed}
                    queues: {genesis_v2_failed: ~}
        routing:
            'App\Message\AdventCaptureDue': async
            'App\Message\QueueItemFinished': async
            'App\Message\FleetArrived': async
            'App\Message\MarketConvoyDue': async
            'App\Message\PirateReconnaissanceDue': async
            'App\Message\PirateAttackDue': async
            'App\Message\PirateConvoyDue': async
            'App\Message\PirateSurvivorsDue': async
            'App\Message\CombatEventDue': async
            'App\Message\PlayerCombatSimulationDue': combat_simulation
            'App\Message\GuildProjectRewardsDue': async
            'App\Message\GuildDockOrderDue': async
            'App\Message\GuildAtelierShipmentDue': async
            'App\Message\GuildHallConstructionDue': async
            'App\Message\GuildAtelierManufacturingDue': async
            'App\Message\OccupationDue': async
            'App\Message\EmpireReconstructionDue': async
            'App\Message\UniverseClosureDue': async
when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                combat_simulation: 'in-memory://'
                failed: 'in-memory://'
