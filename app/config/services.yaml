# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(APP_PERFORMANCE_SAMPLE_PERCENT): '0'
    env(ADMIN_ACTIVATION_ENABLED): '0'
    env(ADMIN_ACTIVATION_RECOVERY_ENABLED): '0'
    env(EMAIL_VERIFICATION_MIXED_READER_ENABLED): '0'
    env(EMAIL_VERIFICATION_VERSIONED_WRITER_ENABLED): '0'
    env(EMAIL_VERIFICATION_ACTIVE_KEY_ID): ''
    env(EMAIL_VERIFICATION_KEYS_JSON): ''
    env(EMAIL_VERIFICATION_SMTP_DSN): ''
    env(LEGAL_PUBLISHER_NAME): ''
    env(MAILER_FROM): 'no-reply@genesis-reborn.local'
    env(EMPIRE_INACTIVITY_WARNINGS_ENABLED): '0'
    env(FORGOTTEN_EMPIRES_ENABLED): '0'
    env(GUILD_HALL_ENABLED): '0'
    env(GUILD_HALL_REQUIRED_STRENGTH): '500000'
    env(GUILD_HALL_REQUIRED_DONORS): '3'
    env(GUILD_HALL_MINIMUM_DONOR_STRENGTH): '50000'
    env(OPS_ALERT_ENABLED): '0'
    env(OPS_ALERT_TO): ''
    env(OPS_ALERT_SIGNAL_SECONDS): '120'
    env(OPS_ALERT_RELAY_SECONDS): '300'
    env(OPS_ALERT_REMINDER_SECONDS): '3600'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\Admin\AdminActivationAction: '@App\Service\Admin\AdminActivationRecoveryAction'
    # Aucun fournisseur autorisé dans le conteneur livré.
    App\Service\Admin\AdminActivationRecoveryAction:
        arguments:
            $provider: null
    App\Service\Admin\AdminActivationTransport: '@App\Service\Admin\UnavailableAdminActivationTransport'

    App\Service\Player\EmailVerificationEmissionSelector:
        arguments:
            $provider: null
            $configuredProvider: '@App\Service\Player\VerificationEmissionProviderFactory'

    Psr\Clock\ClockInterface: '@clock'

    App\Integration\Mercure\PublisherInterface: '@App\Integration\Mercure\MercurePublisher'

    Random\Randomizer: ~

when@test:
    services:
        App\Service\Guild\GuildHallService:
            autowire: true
            public: true
        App\Repository\GuildHallRepository:
            autowire: true
            public: true
        App\Service\Guild\GuildHallFunding:
            autowire: true
            public: true
        App\Service\Player\GuildImageStorage:
            arguments:
                $directory: '%kernel.cache_dir%/guild-media'
