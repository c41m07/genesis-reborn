    "basic": "Vaisseau léger de supériorité, le plus rapide de sa catégorie. Il poursuit et détruit les unités légères, avec une priorité contre les bombardiers. Armement visible : quatre lance-missiles à tête chercheuse intégrés autour du cockpit, laissant des traînées lumineuses.",
    "intermediate": "Intercepteur d’interdiction capable de verrouiller rapidement les bombardiers et chasseurs adverses. Sa vitesse élevée lui permet de contrôler les engagements légers. Armement visible : quatre lance-missiles guidés avec traînées lumineuses plus longues et verrouillage renforcé.",
    "superior": "Intercepteur de supériorité conçu pour dominer les combats rapides et empêcher les bombardiers d’atteindre les grandes unités. Armement visible : batteries de missiles à tête chercheuse autour du cockpit, avec traînées lumineuses multiples."
