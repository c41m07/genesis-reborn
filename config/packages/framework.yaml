framework:
    secret: '%env(APP_SECRET)%'
    default_locale: fr
    csrf_protection: true
    session:
        cookie_httponly: true
        cookie_samesite: lax
        cookie_secure: auto
    php_errors:
        log: true
when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
