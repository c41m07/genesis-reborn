security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
    providers:
        players:
            entity:
                class: App\Entity\Player
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|build)/
            security: false
        main:
            lazy: true
            provider: players
            user_checker: App\Security\PlayerUserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_universes
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
    access_control:
        - {path: ^/(connexion|inscription|health)$, roles: PUBLIC_ACCESS}
        - {path: ^/, roles: ROLE_USER}
when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
