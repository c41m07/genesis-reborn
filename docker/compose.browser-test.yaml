x-empire-test-env: &empire-test-env
  FORGOTTEN_EMPIRES_ENABLED: "0"
  EMPIRE_INACTIVITY_WARNINGS_ENABLED: "0"
services:
  app:
    environment:
      <<: *empire-test-env
      APP_DEBUG: "0"
      MAILER_DSN: "null://null"
      OPS_ALERT_ENABLED: "0"
      MERCURE_PUBLIC_URL: "http://${BROWSER_HOST}/.well-known/mercure"
    networks: !override [backend, traefik]
    labels: !override
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.${BROWSER_ROUTER}.rule=Host(`${BROWSER_HOST}`)"
      - "traefik.http.routers.${BROWSER_ROUTER}.entrypoints=web"
      - "traefik.http.routers.${BROWSER_ROUTER}.service=${BROWSER_ROUTER}"
      - "traefik.http.services.${BROWSER_ROUTER}.loadbalancer.server.port=80"
    tmpfs: ["/app/var:mode=1777"]
  worker:
    environment: *empire-test-env
    tmpfs: ["/app/var:mode=1777"]
  relay:
    environment: *empire-test-env
    tmpfs: ["/app/var:mode=1777"]
  notifier:
    environment: *empire-test-env
    tmpfs: ["/app/var:mode=1777"]
  database:
    ports: !reset []
    volumes: !reset []
    tmpfs: [/var/lib/mysql]
  rabbitmq:
    volumes: !reset []
    tmpfs: [/var/lib/rabbitmq]
  mercure:
    networks: !override [backend, traefik]
    environment:
      MERCURE_EXTRA_DIRECTIVES: "cors_origins http://${BROWSER_HOST}"
    labels: !override
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.${BROWSER_ROUTER}-events.rule=Host(`${BROWSER_HOST}`) && PathPrefix(`/.well-known/mercure`)"
      - "traefik.http.routers.${BROWSER_ROUTER}-events.entrypoints=web"
      - "traefik.http.routers.${BROWSER_ROUTER}-events.service=${BROWSER_ROUTER}-events"
      - "traefik.http.routers.${BROWSER_ROUTER}-events.priority=100"
      - "traefik.http.services.${BROWSER_ROUTER}-events.loadbalancer.server.port=80"
    volumes: !reset []
    tmpfs: [/data, /config]
