name: genesis_reborn_v2
x-app: &app
  build:
    context: .
    dockerfile: docker/dev/Dockerfile
    args:
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-1000}
  image: local/genesis-web:dev
  working_dir: /app
  volumes: ["./app:/app", "./docs:/docs:ro", "./docker:/docker:ro", "./.env:/app/.env:ro", "./.env.local:/app/.env.local:ro"]
  env_file: .env.local
  networks: [backend]
services:
  app:
    <<: *app
    networks: [backend, traefik, mail]
    depends_on:
      database: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik_network
      traefik.http.routers.genesis-reborn-v2.rule: Host(`genesis-reborn.localhost`)
      traefik.http.routers.genesis-reborn-v2.entrypoints: web
      traefik.http.routers.genesis-reborn-v2.service: genesis-reborn-v2
      traefik.http.services.genesis-reborn-v2.loadbalancer.server.port: "80"
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1/health') === 'ok' ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: [php, bin/console, messenger:consume, async, --time-limit=3600, --memory-limit=192M, --no-interaction]
    restart: unless-stopped
    depends_on:
      database: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [backend]
    healthcheck:
      test: [CMD, php, -r, "exit(is_file('var/run/worker.heartbeat') && time()-filemtime('var/run/worker.heartbeat')<45 ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
  relay:
    <<: *app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: [php, bin/console, app:outbox:relay, --loop]
    restart: unless-stopped
    depends_on:
      database: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: [CMD, php, -r, "exit(is_file('var/run/relay.heartbeat') && time()-filemtime('var/run/relay.heartbeat')<45 ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
  notifier:
    <<: *app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: [php, bin/console, app:outbox:relay, --kind=notifications, --loop]
    restart: unless-stopped
    depends_on:
      database: {condition: service_healthy}
      mercure: {condition: service_started}
    healthcheck:
      test: [CMD, php, -r, "exit(is_file('var/run/notifier.heartbeat') && time()-filemtime('var/run/notifier.heartbeat')<45 ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
  mercure:
    image: dunglas/mercure:v0.18@sha256:39f809705671c2f70dbd0f5aeb2dee1e26fc6338e1a0ae50581b51eb6e5ab2a2
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?Configure Mercure key}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?Configure Mercure key}
      MERCURE_EXTRA_DIRECTIVES: 'cors_origins http://genesis-reborn.localhost'
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes: ['mercure_data:/data', 'mercure_config:/config']
    networks: [backend, traefik]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik_network
      traefik.http.routers.genesis-reborn-v2-events.rule: 'Host(`genesis-reborn.localhost`) && PathPrefix(`/.well-known/mercure`)'
      traefik.http.routers.genesis-reborn-v2-events.entrypoints: web
      traefik.http.routers.genesis-reborn-v2-events.service: genesis-reborn-v2-events
      traefik.http.routers.genesis-reborn-v2-events.priority: '100'
      traefik.http.services.genesis-reborn-v2-events.loadbalancer.server.port: '80'
  database:
    image: mariadb:11.8@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
    environment:
      MARIADB_DATABASE: genesis_v2
      MARIADB_USER: genesis
      MARIADB_PASSWORD: ${DB_PASSWORD:?Generate .env.local with make configure}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Generate .env.local with make configure}
    ports: ["127.0.0.1:${DB_HOST_PORT:-3309}:3306"]
    volumes: ["database_data:/var/lib/mysql"]
    networks: [backend]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.3-management-alpine@sha256:3505b6096cdbc083bcc363e74366f575ecd0c1a55be4dadcbc60fa08e34647e1
    environment:
      RABBITMQ_DEFAULT_USER: genesis
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Generate .env.local with make configure}
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"]
    networks: [backend]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 20
  database-test:
    image: mariadb:11.8@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
    profiles: [test]
    environment:
      MARIADB_DATABASE: genesis_v2_test
      MARIADB_USER: genesis_test
      MARIADB_PASSWORD: isolated_test_only
      MARIADB_ROOT_PASSWORD: isolated_test_root_only
    tmpfs: [/var/lib/mysql]
    networks: [backend]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  guild_media:
  database_data:
  rabbitmq_data:
  mercure_data:
  mercure_config:
networks:
  backend:
  traefik:
    external: true
    name: traefik_network
  mail:
    external: true
    name: mail_network
